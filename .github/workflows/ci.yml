name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma versão usada no desenvolvimento. Com Node 22 o `npm ci` falhava
          # aqui e passava na máquina local — CI e desenvolvimento em versões
          # diferentes é fonte exata desse tipo de surpresa.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` primeiro: LayoutProps e PageProps são tipos gerados pelo
      # Next em .next/types. Na máquina de quem já rodou o build eles existem;
      # num clone limpo, não.
      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O build não deve precisar de banco: o cliente Postgres é criado sob
      # demanda, não na importação. Se alguém quebrar isso, este passo falha.
      - name: Build
        run: npm run build
