name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma versão usada no desenvolvimento. CI e máquina local em versões
          # diferentes de Node/npm é fonte de "passa aqui, quebra lá".
          node-version: 24
          cache: npm

      # DIAGNÓSTICO TEMPORÁRIO: publica o erro do npm ci como annotation, que é
      # visível sem login no repositório. Remover assim que o CI ficar verde.
      - name: Instalar dependências
        run: |
          set -o pipefail
          if ! npm ci 2>&1 | tee /tmp/npm-ci.log; then
            echo "::error::npm ci falhou -> $(grep -iE '^npm (error|warn ERESOLVE)' /tmp/npm-ci.log | head -20 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # `next typegen` primeiro: LayoutProps e PageProps são tipos gerados pelo
      # Next em .next/types. Na máquina de quem já rodou o build eles existem;
      # num clone limpo, não.
      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O build não deve precisar de banco: o cliente Postgres é criado sob
      # demanda, não na importação. Se alguém quebrar isso, este passo falha.
      - name: Build
        run: npm run build
