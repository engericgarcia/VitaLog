name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` primeiro: LayoutProps e PageProps sao tipos gerados pelo
      # Next em .next/types. Na maquina de quem ja rodou o build eles existem;
      # num clone limpo, nao — foi exatamente assim que este CI quebrou na
      # primeira execucao, passando local e falhando aqui.
      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O build não deve precisar de banco: o cliente Postgres é criado sob
      # demanda, não na importação. Se alguém quebrar isso, este passo falha.
      - name: Build
        run: npm run build
